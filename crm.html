<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM PetLojas - Gestão de Leads</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        .kanban-col { min-width: 320px; max-width: 320px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ocultar barra de rolagem mas manter funcionalidade */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-gray-900 text-white shadow-md z-10 shrink-0">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-paw text-blue-500 text-2xl"></i>
                <h1 class="text-2xl font-black tracking-tighter uppercase">CRM PetLojas</h1>
                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-widest ml-2">V2 Oficial</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="abrirModalLead()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-2 px-4 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Novo Lead
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex h-full gap-6 pb-4" id="kanban-board">
            
            <div class="kanban-col flex flex-col bg-gray-200/50 rounded-xl">
                <div class="p-4 border-b border-gray-300 flex justify-between items-center bg-gray-200/80 rounded-t-xl">
                    <h2 class="font-bold text-gray-700 uppercase tracking-wide text-sm">Prospectos</h2>
                    <span id="count-prospecto" class="bg-white text-gray-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
                </div>
                <div id="col-prospecto" class="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide"></div>
            </div>

            <div class="kanban-col flex flex-col bg-blue-50/50 rounded-xl">
                <div class="p-4 border-b border-blue-200 flex justify-between items-center bg-blue-100/80 rounded-t-xl">
                    <h2 class="font-bold text-blue-800 uppercase tracking-wide text-sm">Em Atendimento</h2>
                    <span id="count-atendimento" class="bg-white text-blue-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
                </div>
                <div id="col-atendimento" class="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide"></div>
            </div>

            <div class="kanban-col flex flex-col bg-yellow-50/50 rounded-xl">
                <div class="p-4 border-b border-yellow-200 flex justify-between items-center bg-yellow-100/80 rounded-t-xl">
                    <h2 class="font-bold text-yellow-800 uppercase tracking-wide text-sm">Negociação</h2>
                    <span id="count-negociacao" class="bg-white text-yellow-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
                </div>
                <div id="col-negociacao" class="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide"></div>
            </div>

            <div class="kanban-col flex flex-col bg-green-50/50 rounded-xl">
                <div class="p-4 border-b border-green-200 flex justify-between items-center bg-green-100/80 rounded-t-xl">
                    <h2 class="font-bold text-green-800 uppercase tracking-wide text-sm">Fechado (Ganho)</h2>
                    <span id="count-ganho" class="bg-white text-green-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
                </div>
                <div id="col-ganho" class="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide"></div>
            </div>
            
             <div class="kanban-col flex flex-col bg-red-50/50 rounded-xl">
                <div class="p-4 border-b border-red-200 flex justify-between items-center bg-red-100/80 rounded-t-xl">
                    <h2 class="font-bold text-red-800 uppercase tracking-wide text-sm">Perdido</h2>
                    <span id="count-perdido" class="bg-white text-red-600 text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
                </div>
                <div id="col-perdido" class="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide"></div>
            </div>

        </div>
    </main>

    <div id="modal-lead" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md fade-in">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-black text-xl text-gray-900">Adicionar Lead</h3>
                <button onclick="fecharModalLead()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-novo-lead" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nome do Pet Shop / Cliente</label>
                    <input type="text" id="lead-nome" required class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">WhatsApp (Apenas números)</label>
                    <input type="text" id="lead-telefone" required placeholder="5533900000000" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Plano de Interesse</label>
                    <select id="lead-plano" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 outline-none focus:border-blue-500 transition">
                        <option value="Plano 1 (App + Treinamento)">Plano 1 (App + Treinamento)</option>
                        <option value="Plano 2 (App + Gestão Full)">Plano 2 (App + Gestão Full)</option>
                        <option value="Apenas Curioso">Apenas Curioso / Revista</option>
                    </select>
                </div>
                <button type="submit" id="btn-salvar-lead" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg shadow transition mt-2">
                    Salvar Novo Lead
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CREDENCIAIS DA PETLOJAS (CRM V2)
        const firebaseConfig = {
          apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
          authDomain: "crmpetshop.firebaseapp.com",
          projectId: "crmpetshop",
          storageBucket: "crmpetshop.firebasestorage.app",
          messagingSenderId: "381013124221",
          appId: "1:381013124221:web:6a1860b4249c2939b6fd14"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Expondo para o escopo global do HTML
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.serverTimestamp = serverTimestamp;

        // MOTOR EM TEMPO REAL: Ouvir mudanças na coleção 'leads'
        const q = query(collection(db, "leads"), orderBy("data_atualizacao", "desc"));
        onSnapshot(q, (snapshot) => {
            const leadsData = { prospecto: [], atendimento: [], negociacao: [], ganho: [], perdido: [] };
            
            snapshot.forEach(d => {
                const lead = { id: d.id, ...d.data() };
                const st = lead.status_funil || 'prospecto';
                if(leadsData[st]) leadsData[st].push(lead);
            });

            renderizarKanban(leadsData);
        });

        function formatarData(timestamp) {
            if(!timestamp) return "Agora";
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        // RENDERIZAÇÃO DO KANBAN E DOS CARDS
        function renderizarKanban(dados) {
            const colunas = ['prospecto', 'atendimento', 'negociacao', 'ganho', 'perdido'];
            
            colunas.forEach(status => {
                const container = document.getElementById(`col-${status}`);
                const contador = document.getElementById(`count-${status}`);
                container.innerHTML = '';
                contador.innerText = dados[status].length;

                dados[status].forEach(lead => {
                    const htmlCard = `
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition group fade-in">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-900 leading-tight">${lead.nome}</h3>
                                <span class="text-[10px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded ml-2 whitespace-nowrap">${formatarData(lead.data_atualizacao)}</span>
                            </div>
                            
                            <p class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded inline-block mb-4"><i class="fa-solid fa-tag"></i> ${lead.pacote_interesse || 'Geral'}</p>
                            
                            <div class="flex gap-2">
                                <button onclick="abrirWhatsApp('${lead.telefone}', '${lead.nome}')" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 rounded shadow-sm transition flex items-center justify-center gap-1">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                                </button>
                                
                                <button onclick="alert('Módulo de Ficha Detalhada estará integrado em breve! ID: ${lead.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold px-3 py-2 rounded shadow-sm transition flex items-center justify-center">
                                    <i class="fa-solid fa-folder-open"></i> Ficha
                                </button>
                            </div>
                            
                            <div class="mt-3 pt-3 border-t border-gray-100 flex gap-1 overflow-x-auto scrollbar-hide pb-1">
                                ${gerarBotoesMover(lead.id, status)}
                            </div>
                        </div>
                    `;
                    container.innerHTML += htmlCard;
                });
            });
        }

        // LÓGICA DE MOVIMENTAÇÃO DOS CARDS
        function gerarBotoesMover(id, statusAtual) {
            const opcoes = [
                { val: 'prospecto', icone: 'fa-inbox', cor: 'text-gray-500' },
                { val: 'atendimento', icone: 'fa-headset', cor: 'text-blue-500' },
                { val: 'negociacao', icone: 'fa-handshake', cor: 'text-yellow-500' },
                { val: 'ganho', icone: 'fa-check-circle', cor: 'text-green-500' },
                { val: 'perdido', icone: 'fa-ban', cor: 'text-red-500' }
            ];

            let html = '';
            opcoes.forEach(op => {
                if(op.val !== statusAtual) {
                    html += `<button onclick="moverLead('${id}', '${op.val}')" class="p-1.5 px-3 bg-gray-50 hover:bg-gray-100 rounded border border-gray-200 ${op.cor} flex-1 flex justify-center transition" title="Mover para ${op.val}"><i class="fa-solid ${op.icone} text-[10px]"></i></button>`;
                }
            });
            return html;
        }

        window.moverLead = async (id, novoStatus) => {
            try {
                const leadRef = doc(db, "leads", id);
                await updateDoc(leadRef, { 
                    status_funil: novoStatus,
                    data_atualizacao: serverTimestamp() 
                });
            } catch (error) {
                alert("Erro ao mover lead: " + error.message);
            }
        }
    </script>

    <script>
        // Modal Novo Lead
        function abrirModalLead() {
            document.getElementById('modal-lead').classList.remove('hidden');
            document.getElementById('modal-lead').classList.add('flex');
        }
        
        function fecharModalLead() {
            document.getElementById('modal-lead').classList.add('hidden');
            document.getElementById('modal-lead').classList.remove('flex');
            document.getElementById('form-novo-lead').reset();
        }

        // Adicionar Novo Lead
        document.getElementById('form-novo-lead').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-lead');
            btn.disabled = true; btn.innerText = "Salvando...";

            const leadData = {
                nome: document.getElementById('lead-nome').value.trim(),
                telefone: document.getElementById('lead-telefone').value.replace(/\D/g,''),
                pacote_interesse: document.getElementById('lead-plano').value,
                status_funil: 'prospecto',
                data_criacao: window.serverTimestamp(),
                data_atualizacao: window.serverTimestamp()
            };

            try {
                await window.addDoc(window.collection(window.db, "leads"), leadData);
                fecharModalLead();
            } catch (error) {
                alert("Erro ao salvar: " + error.message);
            } finally {
                btn.disabled = false; btn.innerText = "Salvar Novo Lead";
            }
        });

        // Abrir WhatsApp Dinâmico
        function abrirWhatsApp(telefone, nome) {
            const num = telefone.replace(/\D/g, '');
            const msg = encodeURIComponent(`Olá ${nome}, tudo bem? Sou da PetLojas...`);
            window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
