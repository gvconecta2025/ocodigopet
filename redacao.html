<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redação - O Código Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLOQUE SUAS CHAVES DO FIREBASE AQUI
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('formRedacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Publicando..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "artigos"), {
                    titulo: document.getElementById('titulo').value,
                    publico: document.getElementById('publico').value,
                    imagem: document.getElementById('imagem').value,
                    resumo: document.getElementById('resumo').value,
                    conteudo: document.getElementById('conteudo').value,
                    data_publicacao: serverTimestamp()
                });
                alert("Matéria publicada com sucesso!");
                document.getElementById('formRedacao').reset();
            } catch (error) {
                console.error("Erro: ", error);
                alert("Erro ao publicar.");
            } finally {
                btn.innerText = "Publicar Artigo"; btn.disabled = false;
            }
        });
    </script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow border-t-4 border-blue-600">
        <h1 class="text-2xl font-black mb-6 text-gray-800">✍️ Redação O Código Pet</h1>
        <form id="formRedacao" class="space-y-4">
            <div>
                <label class="font-bold text-sm text-gray-700">Público Alvo (Caderno)</label>
                <select id="publico" class="w-full mt-1 p-3 border bg-gray-50 rounded" required>
                    <option value="tutores">Tutores (Leitura Gratuita)</option>
                    <option value="gestores">Gestores Pet (Conteúdo Premium/Pago)</option>
                </select>
            </div>
            <div>
                <label class="font-bold text-sm text-gray-700">Título</label>
                <input type="text" id="titulo" class="w-full mt-1 p-3 border bg-gray-50 rounded" required>
            </div>
            <div>
                <label class="font-bold text-sm text-gray-700">Link da Imagem</label>
                <input type="url" id="imagem" class="w-full mt-1 p-3 border bg-gray-50 rounded" required>
            </div>
            <div>
                <label class="font-bold text-sm text-gray-700">Resumo (Linha Fina)</label>
                <textarea id="resumo" rows="2" class="w-full mt-1 p-3 border bg-gray-50 rounded" required></textarea>
            </div>
            <div>
                <label class="font-bold text-sm text-gray-700">Conteúdo Completo (Aceita HTML)</label>
                <textarea id="conteudo" rows="8" class="w-full mt-1 p-3 border bg-gray-50 rounded" required></textarea>
            </div>
            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-4 rounded hover:bg-blue-700">Publicar Artigo</button>
        </form>
    </div>
</body>
</html>
