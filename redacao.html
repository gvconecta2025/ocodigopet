<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redação - O Código Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLE AQUI AS CHAVES DO SEU NOVO FIREBASE EXCLUSIVO DA REVISTA
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('formRedacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Publicando...";

            try {
                const docRef = await addDoc(collection(db, "revista_artigos"), {
                    titulo: document.getElementById('titulo').value,
                    caderno: document.getElementById('caderno').value,
                    imagem: document.getElementById('imagem').value,
                    resumo: document.getElementById('resumo').value,
                    conteudo: document.getElementById('conteudo').value,
                    data_publicacao: serverTimestamp(),
                    visualizacoes: 0
                });
                alert(`Artigo publicado com sucesso! ID: ${docRef.id}`);
                document.getElementById('formRedacao').reset();
            } catch (error) {
                console.error("Erro ao publicar: ", error);
                alert("Erro ao publicar artigo.");
            } finally {
                btn.innerText = "Publicar Artigo";
            }
        });
    </script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">✍️ Redação - O Código Pet</h1>
        <form id="formRedacao" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Caderno / Categoria</label>
                <select id="caderno" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    <option value="Gestão PRO (B2B)">Gestão PRO (B2B - Lojistas)</option>
                    <option value="Guia do Tutor (B2C)">Guia do Tutor (B2C)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Título do Artigo</label>
                <input type="text" id="titulo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Link da Imagem de Capa</label>
                <input type="url" id="imagem" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Resumo (Linha Fina)</label>
                <textarea id="resumo" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Conteúdo do Artigo (Aceita tags HTML)</label>
                <textarea id="conteudo" rows="8" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required></textarea>
            </div>
            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-700">
                Publicar Artigo
            </button>
        </form>
    </div>
</body>
</html>
