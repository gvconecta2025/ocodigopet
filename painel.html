<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Revista PetLojas - Editor de Artigos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tf-input { @apply w-full bg-white border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition shadow-sm; }
        .tf-label { @apply block text-sm font-bold text-gray-600 mb-1; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-10 flex justify-center items-start min-h-screen">

    <div id="tela-bloqueio" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <i class="fa-solid fa-lock text-4xl text-blue-600 mb-4"></i>
            <h2 class="text-xl font-black text-gray-900 mb-2">Acesso Restrito</h2>
            <p class="text-sm text-gray-500 mb-6">Painel de Criação da Revista PetLojas.</p>
            <input type="password" id="senha-acesso" placeholder="Senha do CMS" class="tf-input text-center mb-4">
            <button onclick="verificarAcesso()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Desbloquear Painel</button>
            <p id="erro-senha" class="text-xs text-red-500 mt-3 hidden">Senha incorreta.</p>
        </div>
    </div>

    <div id="painel-container" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden fade-in hidden">
        
        <div class="bg-gray-900 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter"><i class="fa-solid fa-pen-nib text-blue-500 mr-2"></i> Estúdio de Conteúdo</h1>
                <p class="text-xs text-gray-400 mt-1">Gestor de Artigos da Revista PetLojas</p>
            </div>
            <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded uppercase flex items-center gap-2">
                <i class="fa-solid fa-cloud"></i> Firebase Online
            </span>
        </div>

        <div class="p-6 md:p-8">
            <form id="form-cms" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="tf-label">Categoria do Artigo</label>
                        <select id="cat-id" required class="tf-input">
                            <option value="" disabled selected>Selecione a aba da revista...</option>
                            <option value="varejo">Pet Shop (Varejo)</option>
                            <option value="clinica">Clínica Veterinária</option>
                            <option value="estetica">Banho & Tosa (Estética)</option>
                            <option value="comportamento">Adestramento</option>
                            <option value="hospedagem">Hotelzinho</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="tf-label">Tag Menor (Opcional - Ex: Gestão)</label>
                        <input type="text" id="cat-nome" placeholder="Ex: Finanças, Marketing..." class="tf-input">
                    </div>
                </div>

                <div>
                    <label class="tf-label">Título do Artigo</label>
                    <input type="text" id="art-titulo" required placeholder="Ex: 5 erros fatais no fluxo de caixa..." class="tf-input text-lg font-bold text-gray-900">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                    <div class="md:col-span-2 space-y-6">
                        <div>
                            <label class="tf-label">Link da Imagem de Capa (Unsplash, Google)</label>
                            <input type="url" id="art-img" required placeholder="https://..." class="tf-input text-sm" onchange="atualizarPreview()">
                        </div>
                        <div>
                            <label class="tf-label">Resumo Estratégico (Aparece no Feed inicial)</label>
                            <textarea id="art-resumo" required rows="3" placeholder="Escreva um resumo curto e persuasivo para fazer o leitor clicar no card..." class="tf-input text-sm resize-none"></textarea>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-2 flex flex-col items-center justify-center h-48">
                        <span class="text-[10px] font-bold text-gray-400 uppercase mb-2">Preview da Capa</span>
                        <div id="preview-box" class="w-full h-full bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden">
                            <i class="fa-solid fa-image text-4xl text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label class="tf-label mb-0">Corpo do Artigo (Conteúdo Principal)</label>
                        <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">Você pode colar o HTML gerado aqui</span>
                    </div>
                    <textarea id="art-conteudo" required rows="12" placeholder="<p>Comece seu parágrafo aqui...</p>" class="tf-input font-mono text-sm leading-relaxed bg-gray-50"></textarea>
                </div>

                <div class="flex items-center gap-3 bg-yellow-50 border border-yellow-200 p-4 rounded-xl">
                    <input type="checkbox" id="art-premium" class="w-5 h-5 text-yellow-600 rounded cursor-pointer">
                    <label for="art-premium" class="text-sm font-bold text-yellow-800 cursor-pointer flex flex-col">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-lock"></i> Exigir Cadastro (Artigo Premium)</span>
                        <span class="text-xs font-normal text-yellow-700 mt-0.5">Se marcado, a revista pedirá nome, whatsapp e e-mail antes de liberar a leitura.</span>
                    </label>
                </div>

                <div class="pt-6 border-t border-gray-200 flex justify-end gap-4">
                    <button type="button" onclick="limparCampos()" class="px-6 py-3 text-sm font-bold text-gray-500 hover:text-gray-800 transition">Limpar Tudo</button>
                    <button type="submit" id="btn-publicar" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-8 rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Publicar na Revista
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUAS CREDENCIAIS REAIS DO CRMPETSHOP
        const firebaseConfig = {
          apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
          authDomain: "crmpetshop.firebaseapp.com",
          projectId: "crmpetshop",
          storageBucket: "crmpetshop.firebasestorage.app",
          messagingSenderId: "381013124221",
          appId: "1:381013124221:web:6a1860b4249c2939b6fd14"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lógica da Senha Simples
        window.verificarAcesso = () => {
            const senha = document.getElementById('senha-acesso').value;
            if(senha === 'gvrevista2024') {
                document.getElementById('tela-bloqueio').classList.add('hidden');
                document.getElementById('painel-container').classList.remove('hidden');
            } else {
                document.getElementById('erro-senha').classList.remove('hidden');
            }
        };

        // Lógica de Preview de Imagem
        window.atualizarPreview = () => {
            const url = document.getElementById('art-img').value.trim();
            const box = document.getElementById('preview-box');
            if(url.startsWith('http')) {
                box.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
            } else {
                box.innerHTML = `<i class="fa-solid fa-image text-4xl text-gray-400"></i>`;
            }
        };

        window.limparCampos = () => {
            document.getElementById('form-cms').reset();
            window.atualizarPreview();
        };

        // Lógica de Envio (Injeção no Banco de Dados)
        document.getElementById('form-cms').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-publicar');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando no Banco...`;

            // Monta o objeto de dados que a revista vai ler
            const artigoData = {
                categoriaId: document.getElementById('cat-id').value,
                categoriaNome: document.getElementById('cat-nome').value.trim(),
                titulo: document.getElementById('art-titulo').value.trim(),
                img: document.getElementById('art-img').value.trim(),
                resumo: document.getElementById('art-resumo').value.trim(),
                conteudo: document.getElementById('art-conteudo').value.trim(),
                premium: document.getElementById('art-premium').checked,
                dataPublicacao: serverTimestamp() // Importante: Firebase cuida da data exata
            };

            try {
                // Injeta diretamente na coleção revista_artigos
                const docRef = await addDoc(collection(db, "revista_artigos"), artigoData);
                alert(`🚀 SUCESSO ABSOLUTO!\n\nArtigo "${artigoData.titulo}" publicado.\nAbra a sua revista para conferir!`);
                
                window.limparCampos();
                
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("❌ ERRO ao publicar: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
