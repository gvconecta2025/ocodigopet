<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista O Código Pet - Diagnóstico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .blur-text { filter: blur(6px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-gray-900 text-white text-center p-6 sticky top-0 z-40 shadow-md">
        <h1 class="text-3xl font-black cursor-pointer" onclick="carregarLista('tutores')">O CÓDIGO PET</h1>
        <div class="mt-4 flex justify-center space-x-4">
            <button onclick="carregarLista('tutores')" class="bg-green-600 px-4 py-2 rounded font-bold text-sm hover:bg-green-500">Para Tutores (Grátis)</button>
            <button onclick="carregarLista('gestores')" class="bg-yellow-600 px-4 py-2 rounded font-bold text-sm hover:bg-yellow-500 text-gray-900">Para Gestores (Premium)</button>
        </div>
    </header>

    <main id="app-container" class="max-w-4xl mx-auto p-4 mt-6 min-h-screen"></main>

    <div id="paywall-modal" class="hidden fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl max-w-md w-full text-center">
            <h2 class="text-2xl font-black mb-2 text-gray-900">Conteúdo Premium 🔒</h2>
            <p class="text-gray-600 mb-6 text-sm">Este caderno é exclusivo para donos de Pet Shop e Clínicas. Insira os seus dados para destravar o acesso.</p>
            <form id="formLead" class="space-y-3 text-left">
                <input type="text" id="leadNome" placeholder="O seu Nome" class="w-full p-3 border rounded" required>
                <input type="text" id="leadLoja" placeholder="Nome do seu Pet Shop" class="w-full p-3 border rounded" required>
                <input type="tel" id="leadWhats" placeholder="WhatsApp (com DDD)" class="w-full p-3 border rounded" required>
                <button type="submit" id="btnDestravar" class="w-full bg-yellow-500 text-gray-900 font-black py-4 rounded hover:bg-yellow-400 mt-2">
                    Liberar Leitura Agora
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // AS SUAS CHAVES OFICIAIS DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDdbQabOOtQzgquLrDZ00GPFi0O9FIJaHc",
            authDomain: "ocodigopet.firebaseapp.com",
            projectId: "ocodigopet",
            storageBucket: "ocodigopet.firebasestorage.app",
            messagingSenderId: "631820637339",
            appId: "1:631820637339:web:25ea2942312d65ee09e23e",
            measurementId: "G-Q1HDW15MC9"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const appContainer = document.getElementById('app-container');
        
        const isGestorVIP = localStorage.getItem('codigo_pet_vip') === 'true';

        // FUNÇÃO DE DIAGNÓSTICO: Puxa TUDO sem filtros e sem exigir Índices
        window.carregarLista = async function(publicoAlvo) {
            appContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">A aceder à base de dados...</p>';
            
            try {
                // A query limpa ignora bloqueios de indexação
                const q = query(collection(db, "artigos"));
                const snapshot = await getDocs(q);
                
                let html = `<h2 class="text-2xl font-bold mb-6 border-b pb-2 uppercase text-red-600">DIAGNÓSTICO: TODOS OS ARTIGOS</h2>`;
                html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="bg-white rounded shadow cursor-pointer overflow-hidden border-2 border-red-500" onclick="abrirArtigo('${doc.id}')">
                            <img src="${data.imagem}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <span class="bg-red-100 text-red-800 font-bold px-2 py-1 rounded text-xs">PÚBLICO SALVO: '${data.publico}'</span>
                                <h3 class="text-xl font-bold mt-2 mb-2">${data.titulo}</h3>
                                <p class="text-gray-600 text-sm">${data.resumo}</p>
                            </div>
                        </div>`;
                });
                html += '</div>';
                
                if(snapshot.empty) {
                    appContainer.innerHTML = '<p class="text-center text-red-600 font-bold mt-10">A COLEÇÃO "artigos" EXISTE, MAS ESTÁ VAZIA.</p>';
                } else {
                    appContainer.innerHTML = html;
                }
            } catch (error) {
                appContainer.innerHTML = `<p class="text-center text-red-600 font-bold mt-10">ERRO DE CONEXÃO: ${error.message}</p>`;
            }
        }

        // Abre a matéria completa
        window.abrirArtigo = async function(id) {
            appContainer.innerHTML = '<p class="text-center mt-10">A abrir...</p>';
            const docSnap = await getDoc(doc(db, "artigos", id));

            if (docSnap.exists()) {
                const data = docSnap.data();
                let conteudoHTML = data.conteudo;
                
                if (data.publico === 'gestores' && !isGestorVIP) {
                    conteudoHTML = `<div class="blur-text">${data.conteudo}</div>`;
                    document.getElementById('paywall-modal').classList.remove('hidden');
                }

                appContainer.innerHTML = `
                    <button onclick="carregarLista('tutores')" class="text-blue-600 font-bold mb-4">← Voltar</button>
                    <article class="bg-white p-8 rounded shadow">
                        <span class="bg-gray-200 text-gray-800 font-bold px-2 py-1 rounded text-xs uppercase">${data.publico}</span>
                        <h1 class="text-4xl font-black mt-2 mb-4">${data.titulo}</h1>
                        <img src="${data.imagem}" class="w-full h-64 object-cover rounded mb-8">
                        <div class="prose max-w-none text-lg leading-relaxed text-gray-800">
                            ${conteudoHTML}
                        </div>
                    </article>
                `;
            }
        }

        // Sistema de Captura de Lead
        document.getElementById('formLead').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDestravar');
            btn.innerText = "A processar..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "leads_revista"), {
                    nome: document.getElementById('leadNome').value,
                    loja: document.getElementById('leadLoja').value,
                    whatsapp: document.getElementById('leadWhats').value,
                    data_captura: serverTimestamp()
                });
                
                localStorage.setItem('codigo_pet_vip', 'true');
                window.location.reload();
            } catch (error) {
                console.error(error);
                alert("Erro ao libertar o acesso.");
                btn.innerText = "Liberar Leitura Agora"; btn.disabled = false;
            }
        });

        // Inicia o Diagnóstico ao carregar
        carregarLista('tutores');
    </script>
</body>
</html>
