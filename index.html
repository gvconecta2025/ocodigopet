<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Código Pet - Portal de Notícias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; color: #333; }
        
        /* Estilo G1: Topo Sólido com Degradê Suave */
        .g1-header { background: linear-gradient(to right, #004687 0%, #005aa3 100%); }
        
        /* Cards com Elevação e Sombra */
        .news-card { background: white; border-radius: 4px; transition: all 0.3s ease; border-bottom: 3px solid transparent; }
        .news-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); border-bottom: 3px solid #005aa3; }
        
        /* Paywall Estilo Premium */
        .blur-content { filter: blur(10px); pointer-events: none; user-select: none; }
        .glass-modal { background: rgba(255, 255, 255, 0.95); backdrop-blur: 10px; border-top: 5px solid #005aa3; }
        
        /* Botões de Categoria Estilo G1 */
        .btn-cat { border-bottom: 4px solid transparent; transition: all 0.2s; }
        .btn-cat:hover { background-color: rgba(255,255,255,0.1); border-bottom: 4px solid #fff; }
        .btn-active { border-bottom: 4px solid #fff; font-weight: bold; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <header class="g1-header text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4 border-b border-white/10">
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='?'">
                    <span class="text-3xl font-extrabold tracking-tighter uppercase">O Código Pet</span>
                    <span class="bg-white text-[#004687] px-2 py-0.5 rounded text-[10px] font-bold">REVISTA</span>
                </div>
                
                <button onclick="forçarAtualizacao()" class="text-[10px] border border-white/30 px-3 py-1 rounded hover:bg-white/10 transition-all font-bold uppercase tracking-tighter">
                    Atualizar Agora
                </button>
            </div>
            
            <nav class="flex gap-6 py-3 overflow-x-auto no-scrollbar">
                <button onclick="carregarLista('tutores', this)" class="btn-cat btn-active pb-1 text-sm whitespace-nowrap uppercase tracking-wider">Guia do Tutor</button>
                <button onclick="carregarLista('gestores', this)" class="btn-cat pb-1 text-sm whitespace-nowrap uppercase tracking-wider">Negócios PRO 🔒</button>
            </nav>
        </div>
    </header>

    <main id="app-container" class="max-w-6xl mx-auto p-4 md:p-8 min-h-screen"></main>

    <div id="paywall-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 transition-all">
        <div class="glass-modal p-8 rounded-lg max-w-md w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-4 text-[#004687]">CONTEÚDO EXCLUSIVO</h2>
            <p class="text-gray-600 mb-6 text-sm leading-relaxed">Esta análise é reservada para gestores e parceiros do ecossistema PetLojas. Preencha abaixo para liberar.</p>
            
            <form id="formLead" class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Seu Nome</label>
                    <input type="text" id="leadNome" class="w-full p-3 border-b-2 border-gray-200 bg-gray-50 focus:border-[#004687] outline-none" required>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Nome da Loja</label>
                    <input type="text" id="leadLoja" class="w-full p-3 border-b-2 border-gray-200 bg-gray-50 focus:border-[#004687] outline-none" required>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">WhatsApp</label>
                    <input type="tel" id="leadWhats" class="w-full p-3 border-b-2 border-gray-200 bg-gray-50 focus:border-[#004687] outline-none" required>
                </div>
                <button type="submit" id="btnDestravar" class="w-full bg-[#004687] text-white font-bold py-4 rounded hover:bg-[#003366] transition-all shadow-lg mt-4 uppercase tracking-widest">Liberar Acesso</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdbQabOOtQzgquLrDZ00GPFi0O9FIJaHc",
            authDomain: "ocodigopet.firebaseapp.com",
            projectId: "ocodigopet",
            storageBucket: "ocodigopet.firebasestorage.app",
            messagingSenderId: "631820637339",
            appId: "1:631820637339:web:25ea2942312d65ee09e23e",
            measurementId: "G-Q1HDW15MC9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appContainer = document.getElementById('app-container');
        const isVip = localStorage.getItem('codigo_pet_vip') === 'true';

        window.forçarAtualizacao = async function() {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let r of registrations) { await r.unregister(); }
            if ('caches' in window) {
                const keys = await caches.keys();
                for (let key of keys) { await caches.delete(key); }
            }
            window.location.reload(true);
        }

        window.carregarLista = async function(publicoAlvo, btn) {
            // UI: Atualiza botões
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('btn-active'));
            if(btn) btn.classList.add('btn-active');

            appContainer.innerHTML = '<div class="text-center py-20 text-gray-400 font-bold animate-pulse uppercase">Buscando informações recentes...</div>';
            
            try {
                const q = query(collection(db, "artigos"), where("publico", "==", publicoAlvo), orderBy("data_publicacao", "desc"));
                const snapshot = await getDocs(q);
                
                let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="news-card border border-gray-200 overflow-hidden cursor-pointer" onclick="abrirArtigo('${doc.id}')">
                            <img src="${data.imagem}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <span class="text-[#004687] text-[10px] font-bold uppercase tracking-widest mb-2 block">${data.publico}</span>
                                <h3 class="text-xl font-bold text-gray-800 leading-tight mb-3 line-clamp-2">${data.titulo}</h3>
                                <p class="text-gray-500 text-sm line-clamp-2">${data.resumo}</p>
                            </div>
                        </div>`;
                });
                html += '</div>';
                appContainer.innerHTML = snapshot.empty ? '<div class="text-center py-20">Nenhuma notícia nesta editoria.</div>' : html;
            } catch (error) { console.error(error); }
        }

        window.abrirArtigo = async function(id) {
            window.scrollTo(0,0);
            appContainer.innerHTML = '<div class="text-center py-20">Carregando matéria completa...</div>';
            const docSnap = await getDoc(doc(db, "artigos", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                let conteudoHTML = data.conteudo;
                if (data.publico === 'gestores' && !isVip) {
                    conteudoHTML = `<div class="blur-content">${data.conteudo}</div>`;
                    setTimeout(() => document.getElementById('paywall-modal').classList.remove('hidden'), 500);
                }
                appContainer.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <button onclick="carregarLista('${data.publico}')" class="text-[#004687] font-bold text-xs mb-6 uppercase tracking-tighter hover:underline">← Voltar para ${data.publico}</button>
                        <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 mb-4 leading-tight">${data.titulo}</h1>
                        <p class="text-xl text-gray-500 mb-8 leading-relaxed border-l-4 border-gray-200 pl-4">${data.resumo}</p>
                        <img src="${data.imagem}" class="w-full h-auto rounded shadow-lg mb-10">
                        <div class="prose max-w-none text-lg leading-relaxed text-gray-800 space-y-6">
                            ${conteudoHTML.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            }
        }

        document.getElementById('formLead').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDestravar');
            btn.innerText = "LIBERANDO...";
            try {
                await addDoc(collection(db, "leads_revista"), {
                    nome: document.getElementById('leadNome').value,
                    loja: document.getElementById('leadLoja').value,
                    whatsapp: document.getElementById('leadWhats').value,
                    data_captura: serverTimestamp()
                });
                localStorage.setItem('codigo_pet_vip', 'true');
                window.location.reload();
            } catch (error) { alert("Erro ao processar lead"); btn.innerText = "LIBERAR ACESSO"; }
        });

        carregarLista('tutores');
    </script>
</body>
</html>
