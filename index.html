<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista O Código Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .blur-text { filter: blur(6px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-gray-900 text-white text-center p-6 sticky top-0 z-40 shadow-md">
        <h1 class="text-3xl font-black cursor-pointer" onclick="carregarLista('tutores')">O CÓDIGO PET</h1>
        <div class="mt-4 flex justify-center space-x-4">
            <button onclick="carregarLista('tutores')" class="bg-green-600 px-4 py-2 rounded font-bold text-sm hover:bg-green-500">Para Tutores (Grátis)</button>
            <button onclick="carregarLista('gestores')" class="bg-yellow-600 px-4 py-2 rounded font-bold text-sm hover:bg-yellow-500 text-gray-900">Para Gestores (Premium)</button>
        </div>
    </header>

    <main id="app-container" class="max-w-4xl mx-auto p-4 mt-6 min-h-screen"></main>

    <div id="paywall-modal" class="hidden fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl max-w-md w-full text-center">
            <h2 class="text-2xl font-black mb-2 text-gray-900">Conteúdo Premium 🔒</h2>
            <p class="text-gray-600 mb-6 text-sm">Este caderno é exclusivo para donos de Pet Shop e Clínicas. Insira seus dados para destravar o acesso.</p>
            <form id="formLead" class="space-y-3 text-left">
                <input type="text" id="leadNome" placeholder="Seu Nome" class="w-full p-3 border rounded" required>
                <input type="text" id="leadLoja" placeholder="Nome do seu Pet Shop" class="w-full p-3 border rounded" required>
                <input type="tel" id="leadWhats" placeholder="WhatsApp (com DDD)" class="w-full p-3 border rounded" required>
                <button type="submit" id="btnDestravar" class="w-full bg-yellow-500 text-gray-900 font-black py-4 rounded hover:bg-yellow-400 mt-2">
                    Liberar Leitura Agora
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLOQUE SUAS CHAVES DO FIREBASE AQUI TAMBÉM
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appContainer = document.getElementById('app-container');
        
        // Verifica se o usuário já preencheu o formulário antes
        const isGestorVIP = localStorage.getItem('codigo_pet_vip') === 'true';

        // Torna a função global para os botões do menu funcionarem
        window.carregarLista = async function(publicoAlvo) {
            appContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">Carregando artigos...</p>';
            
            // Busca apenas os artigos da aba clicada
            const q = query(collection(db, "artigos"), where("publico", "==", publicoAlvo));
            const snapshot = await getDocs(q);
            
            let html = `<h2 class="text-2xl font-bold mb-6 border-b pb-2 uppercase">${publicoAlvo}</h2>`;
            html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `
                    <div class="bg-white rounded shadow cursor-pointer overflow-hidden hover:shadow-lg" onclick="abrirArtigo('${doc.id}')">
                        <img src="${data.imagem}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-xl font-bold mb-2">${data.titulo}</h3>
                            <p class="text-gray-600 text-sm">${data.resumo}</p>
                        </div>
                    </div>`;
            });
            html += '</div>';
            appContainer.innerHTML = snapshot.empty ? '<p>Nenhum artigo encontrado.</p>' : html;
        }

        // Abre a matéria completa
        window.abrirArtigo = async function(id) {
            appContainer.innerHTML = '<p class="text-center mt-10">Abrindo...</p>';
            const docSnap = await getDoc(doc(db, "artigos", id));

            if (docSnap.exists()) {
                const data = docSnap.data();
                let conteudoHTML = data.conteudo;
                
                // Regra do Paywall: Se for conteúdo de gestor e ele não for VIP
                if (data.publico === 'gestores' && !isGestorVIP) {
                    conteudoHTML = `<div class="blur-text">${data.conteudo}</div>`;
                    document.getElementById('paywall-modal').classList.remove('hidden');
                }

                appContainer.innerHTML = `
                    <button onclick="carregarLista('${data.publico}')" class="text-blue-600 font-bold mb-4">← Voltar</button>
                    <article class="bg-white p-8 rounded shadow">
                        <h1 class="text-4xl font-black mb-4">${data.titulo}</h1>
                        <img src="${data.imagem}" class="w-full h-64 object-cover rounded mb-8">
                        <div class="prose max-w-none text-lg leading-relaxed text-gray-800">
                            ${conteudoHTML}
                        </div>
                    </article>
                `;
            }
        }

        // Sistema de Captura de Lead (Desbloqueio)
        document.getElementById('formLead').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDestravar');
            btn.innerText = "Processando..."; btn.disabled = true;

            try {
                // Grava o Lead no Firebase
                await addDoc(collection(db, "leads_revista"), {
                    nome: document.getElementById('leadNome').value,
                    loja: document.getElementById('leadLoja').value,
                    whatsapp: document.getElementById('leadWhats').value,
                    data_captura: serverTimestamp()
                });
                
                // Grava autorização no navegador
                localStorage.setItem('codigo_pet_vip', 'true');
                
                // Recarrega a página para limpar o Blur
                window.location.reload();
            } catch (error) {
                console.error(error);
                alert("Erro ao liberar acesso.");
                btn.innerText = "Liberar Leitura Agora"; btn.disabled = false;
            }
        });

        // Inicia carregando os artigos de Tutores por padrão
        carregarLista('tutores');
    </script>
</body>
</html>
