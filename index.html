<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Código Pet - Revista Semanal</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .header-line { border-top: 4px solid #ef4444; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .blur-content { filter: blur(6px); user-select: none; pointer-events: none; }
        
        /* Botões do Formulário */
        .tf-option { 
            @apply w-full bg-white border-2 border-gray-100 text-gray-700 font-bold text-left px-6 py-4 text-[16px] rounded-full mb-3 shadow-sm hover:border-blue-400 hover:bg-blue-50 active:scale-95 transition-all flex items-center justify-between; 
        }
        .btn-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased overflow-x-hidden">

    <div id="side-menu" class="fixed inset-0 bg-black/60 z-[60] hidden transition-opacity opacity-0" onclick="fecharMenuClickFora(event)">
        <div class="absolute right-0 top-0 bottom-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="side-menu-panel">
            <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="font-black text-gray-900 text-lg uppercase tracking-tighter">O Código Pet</h2>
                <button onclick="toggleMenu()" class="text-gray-500 hover:text-red-600 text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 flex-1 overflow-y-auto">
                <h3 class="font-bold text-gray-400 text-[10px] uppercase tracking-[0.2em] mb-4">Acervo de Edições</h3>
                <ul class="space-y-4">
                    <li><button onclick="toggleMenu(); renderView('home')" class="w-full flex items-center justify-between font-black text-blue-700 border border-blue-200 bg-blue-50 p-3 rounded-lg">Edição 01 <span class="bg-blue-600 text-white text-[9px] px-2 py-1 rounded uppercase">Atual</span></button></li>
                </ul>
            </div>
            <div class="p-5 border-t border-gray-100">
                <p class="text-[9px] text-gray-400 text-center uppercase tracking-widest font-bold">Uma iniciativa GV Conecta</p>
            </div>
        </div>
    </div>

    <div id="app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col">
        
        <header class="bg-white sticky top-0 z-40 shadow-md header-line w-full">
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex flex-col cursor-pointer group" onclick="handleLogoClick()">
                    <h1 class="text-2xl font-black tracking-tighter text-blue-700 uppercase leading-none">O CÓDIGO PET</h1>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">Revista do Profissional</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">Ed. 01</span>
                    <button onclick="toggleMenu()" class="text-gray-700 focus:outline-none p-1"><i class="fa-solid fa-bars text-2xl"></i></button>
                </div>
            </div>
            
            <div id="nav-categorias" class="bg-gray-50 border-b border-gray-200 px-4 py-2 overflow-x-auto whitespace-nowrap text-[11px] font-bold text-gray-500 uppercase tracking-wide flex gap-5 scrollbar-hide">
                <span onclick="goToCategory('varejo')" class="cursor-pointer hover:text-blue-600 transition">Pet Shop</span>
                <span onclick="goToCategory('clinica')" class="cursor-pointer hover:text-teal-600 transition">Clínica</span>
                <span onclick="goToCategory('estetica')" class="cursor-pointer hover:text-pink-600 transition">Estética</span>
                <span onclick="goToCategory('comportamento')" class="cursor-pointer hover:text-orange-600 transition">Adestramento</span>
                <span onclick="goToCategory('hospedagem')" class="cursor-pointer hover:text-indigo-600 transition">Hotelzinho</span>
            </div>
        </header>

        <main id="main-content" class="flex-1 pb-16 bg-white"></main>

        <footer class="bg-gray-900 text-white p-6 text-center">
            <div class="text-[10px] text-gray-500 uppercase tracking-[0.3em] font-bold mb-2">Produzido por</div>
            <h3 class="text-xl font-black tracking-tighter text-blue-400">GV CONECTA</h3>
            <p class="text-[9px] text-gray-400 mt-1 uppercase tracking-widest">Marketing para Negócios Locais</p>
        </footer>

        <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto z-30 pointer-events-none h-12">
            <button id="btn-voltar" onclick="renderView('home')" class="hidden absolute left-5 pointer-events-auto w-12 h-12 bg-black/60 backdrop-blur-md border border-white/20 rounded-full text-white flex items-center justify-center shadow-2xl hover:bg-black/80 active:scale-90 transition-all duration-300"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <button id="btn-up" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="absolute right-5 pointer-events-auto w-12 h-12 bg-black/60 backdrop-blur-md border border-white/20 rounded-full text-white flex items-center justify-center shadow-2xl hover:bg-black/80 active:scale-90 transition-all duration-300 translate-y-10 opacity-0"><i class="fa-solid fa-arrow-up text-lg"></i></button>
        </div>

        <div id="typeform-modal" class="fixed inset-0 bg-white z-[100] hidden flex-col max-w-md mx-auto h-screen">
            <div class="w-full bg-gray-200 h-1"><div id="tf-progress" class="bg-blue-600 h-1 w-0 transition-all duration-300"></div></div>
            <div class="p-5 flex justify-between items-center border-b border-gray-100">
                <span id="tf-title" class="text-xs font-bold text-gray-400 uppercase tracking-widest">Tenha acesso Premium</span>
                <button onclick="fecharTypeform()" class="text-gray-400 hover:text-gray-800 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 flex flex-col pt-6" id="tf-content-body">
                </div>
        </div>
    </div>

    <script>
        window.registrarEvento = function() {};
        window.qualificarLead = async function() {};
        window.fetchAdminData = async function() { return { totalEventos: 0, totalLeads: 0, leadsList: [] }; };

        let tfData = { cargo: '', desafio: '', interesses: [], nome: '', whatsapp: '', email: '', tipo: 'gestor' };
        let pendingArticle = null;
        let currentView = 'home';
        
        let logoClicks = 0;
        let logoTimer = null;
        window.handleLogoClick = function() {
            if (currentView !== 'home' && currentView !== 'admin') renderView('home');
            logoClicks++;
            if (logoClicks >= 5) { logoClicks = 0; renderView('admin'); }
            clearTimeout(logoTimer);
            logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
        }

        const bancoDeArtigos = {
            varejo: { id: 'varejo', nome: 'Pet Shop', tagColor: 'text-blue-700', bgColor: 'bg-blue-50', artigos: [
                { id: 'v1', premium: false, titulo: '5 técnicas de vitrinismo para aumentar a venda de brinquedos', img: 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=600&q=80', resumo: 'Como organizar as prateleiras de forma que o cliente compre por impulso.' },
                { id: 'v2', premium: false, titulo: 'O roteiro de atendimento perfeito no balcão', img: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=600&q=80', resumo: 'O que o seu atendente deve dizer para fechar vendas mais rápidas.' },
                { id: 'v3', premium: false, titulo: 'Como identificar produtos vencidos mais rápido', img: 'https://images.unsplash.com/photo-1553688738-a278b9f063e0?w=600&q=80', resumo: 'Um método visual simples para evitar prejuízos no estoque.' },
                { id: 'v4', premium: true, titulo: 'Gestão de Estoque: A matemática oculta que devora o seu caixa', img: 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=600&q=80', resumo: 'Planilha prática de giro de estoque para não imobilizar capital.' },
                { id: 'v5', premium: true, titulo: 'Como precificar Rações Premium e manter a margem', img: 'https://images.unsplash.com/photo-1629905925292-3e2849b2b528?w=600&q=80', resumo: 'Estratégia de markup vs margem de contribuição.' },
                { id: 'v6', premium: true, titulo: 'Funil de Vendas no WhatsApp para Donos de Pet Shop', img: 'https://images.unsplash.com/photo-1611162616475-46b635cb6868?w=600&q=80', resumo: 'Automação de mensagens para vender acessórios sem esforço.' }
            ]},
            clinica: { id: 'clinica', nome: 'Clínica Veterinária', tagColor: 'text-teal-700', bgColor: 'bg-teal-50', artigos: [
                { id: 'c1', premium: false, titulo: 'Técnicas de contenção cat-friendly na triagem', img: 'https://images.unsplash.com/photo-1628009368231-7bb7cb192fb6?w=600&q=80', resumo: 'Como evitar o estresse dos felinos na sala de espera.' },
                { id: 'c2', premium: false, titulo: 'Protocolo de assepsia rápida de consultórios', img: 'https://images.unsplash.com/photo-1576201836106-db1758fd1c97?w=600&q=80', resumo: 'O checklist de limpeza entre atendimentos.' },
                { id: 'c3', premium: false, titulo: 'Como comunicar o diagnóstico preliminar ao tutor', img: 'https://images.unsplash.com/photo-1584820927498-cafe6c1c953a?w=600&q=80', resumo: 'Empatia e clareza na recepção clínica.' },
                { id: 'c4', premium: true, titulo: 'Derrubando o "No-Show": Gestão de Agendamentos', img: 'https://images.unsplash.com/photo-1551076805-e1869043e560?w=600&q=80', resumo: 'O fluxo de mensagens que reduz as faltas em 80%.' },
                { id: 'c5', premium: true, titulo: 'Calculando a hora clínica: Custo Fixo vs Hora Útil', img: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=600&q=80', resumo: 'Descubra qual é o custo real para manter o consultório de portas abertas.' },
                { id: 'c6', premium: true, titulo: 'Planos de Saúde Preventiva: Receita Recorrente', img: 'https://images.unsplash.com/photo-1606425271394-c3ca9aa1fc06?w=600&q=80', resumo: 'Como criar e vender pacotes anuais de vacina e check-up.' }
            ]}
        };

        window.toggleMenu = function() {
            const menu = document.getElementById('side-menu');
            const panel = document.getElementById('side-menu-panel');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => { menu.classList.remove('opacity-0'); panel.classList.remove('translate-x-full'); }, 10);
            } else {
                panel.classList.add('translate-x-full'); menu.classList.add('opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }
        window.fecharMenuClickFora = function(event) { if(event.target.id === 'side-menu') toggleMenu(); }

        window.goToCategory = function(catId) {
            if (currentView !== 'home') renderView('home');
            setTimeout(() => {
                const section = document.getElementById('sec-' + catId);
                if(section) window.scrollTo({top: section.getBoundingClientRect().top + window.scrollY - 100, behavior: 'smooth'});
            }, 50);
        }

        window.renderView = function(view, param = null) {
            currentView = view;
            const mainContent = document.getElementById('main-content');
            const btnVoltar = document.getElementById('btn-voltar');
            const navCategorias = document.getElementById('nav-categorias');
            mainContent.innerHTML = ''; window.scrollTo(0, 0);
            if (view === 'home') { btnVoltar.classList.add('hidden'); navCategorias.classList.remove('hidden'); renderHomeFeed(mainContent); }
            else if (view === 'artigo') { btnVoltar.classList.remove('hidden'); navCategorias.classList.remove('hidden'); renderArtigo(mainContent, param); }
            else if (view === 'admin') { btnVoltar.classList.remove('hidden'); navCategorias.classList.add('hidden'); renderAdminPanel(mainContent); }
        };

        function renderHomeFeed(container) {
            let html = `<div class="fade-in">
                <div class="px-5 pt-6 pb-4 bg-white border-b border-gray-100">
                    <p class="text-sm text-gray-600 leading-relaxed">
                        Conteúdo prático para a linha de frente (<strong class="text-gray-900">funcionários</strong>) e estratégias avançadas de gestão e finanças exclusivas para <strong class="text-gray-900">decisores de negócios Pet</strong>.
                    </p>
                </div>
            `;

            let sectionCount = 0;
            for (const key in bancoDeArtigos) {
                const cat = bancoDeArtigos[key];
                html += `
                    <section id="sec-${cat.id}" class="${cat.bgColor} py-8 px-4 border-t border-gray-200">
                        <h3 class="${cat.tagColor} text-sm font-black uppercase tracking-[0.2em] mb-5 border-l-4 border-current pl-3">${cat.nome}</h3>
                        <div class="flex flex-col gap-6">
                `;
                
                cat.artigos.forEach((artigo, idx) => {
                    const badge = artigo.premium ? `<span class="text-[10px] text-yellow-700 font-bold bg-yellow-200 px-2 py-0.5 rounded ml-2 inline-flex items-center gap-1 shrink-0"><i class="fa-solid fa-lock text-[9px]"></i> Premium Gestão</span>` : '';
                    if (idx === 0 || idx === 3) {
                        html += `
                            <div class="cursor-pointer group relative" onclick="tratarCliqueArtigo('${key}', '${artigo.id}')">
                                <img src="${artigo.img}" class="w-full h-48 object-cover rounded shadow-sm mb-3 group-hover:opacity-90 transition">
                                <h4 class="font-bold text-xl text-gray-900 leading-tight group-hover:text-blue-700 transition flex flex-wrap items-center gap-y-2">${artigo.titulo} ${badge}</h4>
                                <p class="text-gray-500 text-sm mt-1 line-clamp-2">${artigo.resumo}</p>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="flex items-start gap-4 cursor-pointer group border-t border-gray-200/50 pt-4" onclick="tratarCliqueArtigo('${key}', '${artigo.id}')">
                                <div class="flex-1 pt-1"><h4 class="font-bold text-base text-gray-800 leading-tight group-hover:text-blue-700 transition inline-block">${artigo.titulo} ${badge}</h4></div>
                                <img src="${artigo.img}" class="w-24 h-16 object-cover rounded shadow-sm group-hover:opacity-90 shrink-0">
                            </div>
                        `;
                    }
                });
                html += `</div></section>`;

                // 🧲 BANNER PETLOJAS (MODELO 1: VENDA PARA TODA A CIDADE)
                if (sectionCount === 0) {
                    html += `
                        <div class="my-8 px-4">
                            <div class="rounded-3xl overflow-hidden shadow-2xl border-2 border-blue-600 cursor-pointer" onclick="window.open('https://petlojas.vercel.app/', '_blank'); window.registrarEvento('clique_ad_petlojas', {});">
                                
                                <div class="bg-gray-200 h-40 flex items-center justify-center text-gray-500 font-bold uppercase tracking-widest text-xs relative overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1522204523234-8729aa6e3d5f?w=800&q=80" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                                    <div class="flex flex-col items-center gap-2 hidden">
                                        <i class="fa-solid fa-store text-3xl"></i>
                                        <span class="text-gray-400">petlojas-retangular.png</span>
                                    </div>
                                    <span class="absolute top-2 right-2 bg-gray-900/60 backdrop-blur-sm text-white text-[9px] font-black px-2.5 py-1 rounded-full uppercase tracking-widest z-10">Iniciativa GV Conecta</span>
                                </div>

                                <div class="p-6 bg-blue-600 text-white text-center">
                                    <h4 class="font-black text-2xl mb-2 leading-tight tracking-tight">Venda para toda a cidade com uma de nossas PetLojas.</h4>
                                    
                                    <span class="inline-block bg-white text-blue-700 font-black text-base px-10 py-3 rounded-full uppercase tracking-widest shadow-md mt-2">Saiba como.</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                sectionCount++;
            }
            container.innerHTML = html + `</div>`;
        }

        window.tratarCliqueArtigo = function(catId, artigoId) {
            const artigo = bancoDeArtigos[catId].artigos.find(a => a.id === artigoId);
            const isQualificado = localStorage.getItem('petlojas_lead_qualificado') === 'true';
            if (artigo.premium && !isQualificado) { pendingArticle = { catId, artigoId }; abrirTypeform(); }
            else { window.registrarEvento('leu_artigo', { categoria: catId, artigo_id: artigoId }); renderView('artigo', { catId, artigo }); }
        }

        window.abrirTypeform = function() {
            document.getElementById('typeform-modal').classList.remove('hidden');
            document.getElementById('typeform-modal').classList.add('flex');
            document.body.style.overflow = 'hidden'; 
            renderStep1();
        }

        window.fecharTypeform = function() {
            document.getElementById('typeform-modal').classList.add('hidden');
            document.getElementById('typeform-modal').classList.remove('flex');
            document.body.style.overflow = '';
        }

        function updateProgress(step, total) { document.getElementById('tf-progress').style.width = ((step / total) * 100) + '%'; }

        function renderStep1() {
            updateProgress(1, 4);
            document.getElementById('tf-content-body').innerHTML = `
                <div class="tf-step slide-up w-full">
                    <span class="text-blue-600 font-bold mb-2 block">1 de 4</span>
                    <h2 class="text-2xl font-black text-gray-900 mb-4 leading-tight">Qual a sua função na empresa?</h2>
                    <button onclick="tfNextStep('cargo', 'Dono / Sócio', 2)" class="tf-option"><span>Dono(a) / Sócio(a)</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('cargo', 'Gerente', 2)" class="tf-option"><span>Gerente / Adm</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('cargo', 'Veterinário', 2)" class="tf-option"><span>Médico Veterinário</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('cargo', 'Coordenador', 2)" class="tf-option"><span>Coordenador Operacional</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                </div>
            `;
        }

        function renderStep2() {
            updateProgress(2, 4);
            document.getElementById('tf-content-body').innerHTML = `
                <div class="tf-step slide-up w-full">
                    <span class="text-blue-600 font-bold mb-2 block">2 de 4</span>
                    <h2 class="text-2xl font-black text-gray-900 mb-8 leading-tight">Qual é o maior desafio na sua operation hoje?</h2>
                    <button onclick="tfNextStep('desafio', 'Atrair clientes', 'interesses')" class="tf-option"><span>Atrair novos clientes</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('desafio', 'Tempo/Organização', 'interesses')" class="tf-option"><span>Falta de tempo</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('desafio', 'Lucro Baixo', 'interesses')" class="tf-option"><span>Margem de lucro baixa</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                    <button onclick="tfNextStep('desafio', 'Gestão Equipe', 'interesses')" class="tf-option"><span>Problemas com a equipe</span> <i class="fa-solid fa-chevron-right text-blue-400"></i></button>
                </div>
            `;
        }

        function renderStepInteresses() {
            updateProgress(3, 4);
            document.getElementById('tf-content-body').innerHTML = `
                <div class="tf-step slide-up w-full">
                    <span class="text-blue-600 font-bold mb-2 block">3 de 4</span>
                    <h2 class="text-2xl font-black text-gray-900 mb-2 leading-tight">O que você quer ler no futuro?</h2>
                    <div class="flex flex-wrap gap-2 mb-8 mt-4">
                        ${['Gestão Financeira', 'Precificação', 'Vendas WhatsApp', 'Gestão Estoque', 'Contratação', 'Marketing Instagram', 'Fidelização', 'Automação'].map(t => 
                            `<button type="button" onclick="toggleTag(this, '${t}')" class="border-2 border-gray-200 bg-white text-gray-600 px-4 py-2 rounded-full text-[11px] font-bold transition-all">${t}</button>`
                        ).join('')}
                    </div>
                    <button onclick="renderStepFinal()" class="w-full bg-gray-900 text-white font-black py-4 rounded-full shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">Continuar <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            `;
        }

        function renderStepFinal() {
            updateProgress(4, 4);
            document.getElementById('tf-content-body').innerHTML = `
                <div class="tf-step slide-up w-full">
                    <span class="text-blue-600 font-bold mb-2 block">4 de 4</span>
                    <h2 class="text-2xl font-black text-gray-900 mb-2 leading-tight">Último passo!</h2>
                    <p class="text-sm text-gray-500 mb-8 leading-relaxed">Inscreva-se na lista para acessar. <strong class="text-gray-800">100% Gratuito.</strong></p>
                    <input type="text" id="tf-nome" placeholder="Seu Nome" class="w-full bg-gray-50 border border-gray-300 text-gray-900 font-bold rounded-full outline-none px-6 py-4 mb-3 transition-all text-lg shadow-sm">
                    <input type="email" id="tf-email" placeholder="E-mail principal" class="w-full bg-gray-50 border border-gray-300 text-gray-900 font-bold rounded-full outline-none px-6 py-4 mb-3 transition-all text-lg shadow-sm">
                    <input type="tel" id="tf-whatsapp" placeholder="WhatsApp" class="w-full bg-gray-50 border border-gray-300 text-gray-900 font-bold rounded-full outline-none px-6 py-4 mb-8 transition-all text-lg shadow-sm">
                    <button onclick="tfSubmit()" class="w-full bg-blue-600 text-white font-black text-lg py-5 rounded-full shadow-lg active:scale-95 transition-transform">Finalizar <i class="fa-solid fa-check ml-2"></i></button>
                </div>
            `;
        }

        window.tfNextStep = function(chave, valor, next) {
            if(chave && valor) tfData[chave] = valor;
            if(next === 2) renderStep2();
            if(next === 'interesses') renderStepInteresses();
        }

        window.toggleTag = function(btn, tema) {
            if(tfData.interesses.includes(tema)) { tfData.interesses = tfData.interesses.filter(t => t !== tema); btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); } 
            else { tfData.interesses.push(tema); btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); }
        }

        window.tfSubmit = function() {
            tfData.nome = document.getElementById('tf-nome').value.trim();
            tfData.whatsapp = document.getElementById('tf-whatsapp').value.trim();
            tfData.email = document.getElementById('tf-email').value.trim();
            if (!tfData.nome || tfData.whatsapp.length < 10 || !tfData.email.includes('@')) { alert("Por favor, preencha todos os campos."); return; }
            
            localStorage.setItem('petlojas_lead_qualificado', 'true');
            window.qualificarLead(tfData);
            fecharTypeform();
            
            if (pendingArticle) {
                const artigo = bancoDeArtigos[pendingArticle.catId].artigos.find(a => a.id === pendingArticle.artigoId);
                renderView('artigo', { catId: pendingArticle.catId, artigo: artigo });
            } else {
                renderView('home'); alert("Inscrição realizada com sucesso!");
            }
        }

        function renderArtigo(container, dados) {
            const { catId, artigo } = dados;
            container.innerHTML = `
                <div class="fade-in bg-white min-h-screen">
                    <div class="px-5 pt-8 pb-6">
                        ${artigo.premium ? '<span class="bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded uppercase mb-3 inline-block tracking-widest border border-yellow-200"><i class="fa-solid fa-lock text-[9px]"></i> Premium Gestão</span>' : ''}
                        <h1 class="text-3xl font-black text-gray-900 leading-tight tracking-tight">${artigo.titulo}</h1>
                    </div>
                    <img src="${artigo.img}" class="w-full h-64 object-cover shadow-inner">
                    <div class="px-6 py-8 text-gray-800 leading-relaxed text-lg font-serif">
                        <p><span class="float-left text-6xl font-black mr-3 mt-2 text-blue-600 font-sans leading-none">O</span> conteúdo estratégico deste material foca no crescimento do seu negócio pet.</p>
                        <p class="mt-4">Nós da <strong class="text-blue-600">GV Conecta</strong> criamos o <strong class="text-gray-900">PetLojas</strong> para resolver a sua operação de vendas online de forma definitiva.</p>
                    </div>
                    <div class="m-5 p-8 rounded-3xl bg-blue-600 text-white text-center shadow-xl">
                        <h4 class="font-black text-xl mb-4 leading-tight">Quer automatizar suas vendas?</h4>
                        <button onclick="window.open('https://petlojas.vercel.app/', '_blank'); window.registrarEvento('clique_ad_petlojas', {});" class="w-full bg-white text-blue-700 font-black py-4 rounded-full shadow-lg active:scale-95 transition-transform">Conhecer o PetLojas</button>
                    </div>
                </div>`;
        }

        window.clicouCTA = (o) => window.registrarEvento('clicou_cta', { de: o });
        window.addEventListener('scroll', () => {
            const btnUp = document.getElementById('btn-up');
            if(btnUp) window.scrollY > 300 ? btnUp.classList.remove('translate-y-10', 'opacity-0') : btnUp.classList.add('translate-y-10', 'opacity-0');
        });

        renderView('home');
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
                authDomain: "crmpetshop.firebaseapp.com",
                projectId: "crmpetshop",
                storageBucket: "crmpetshop.firebasestorage.app",
                messagingSenderId: "381013124221",
                appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
            };
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            window.registrarEvento = async function(tipo, detalhes) {
                try { await addDoc(collection(db, "eventos_tracking"), { lead_id: localStorage.getItem('petlojas_whatsapp_lead') || 'anonimo', origem: "revista", tipo_evento: tipo, detalhes, timestamp: Date.now() }); } catch (e) {}
            }

            window.qualificarLead = async function(dados) {
                try { await addDoc(collection(db, "leads_qualificados_revista"), { ...dados, origem: "revista", data_captura: serverTimestamp() }); } catch (e) {}
            }

            window.fetchAdminData = async function() {
                let report = { totalLeads: 0, totalEventos: 0, leadsList: [] };
                try {
                    const snapLeads = await getDocs(query(collection(db, "leads_qualificados_revista"), limit(20)));
                    report.totalLeads = snapLeads.size;
                    snapLeads.forEach(doc => report.leadsList.push(doc.data()));
                    const snapEventos = await getDocs(query(collection(db, "eventos_tracking"), limit(50)));
                    report.totalEventos = snapEventos.size;
                } catch(e) {}
                return report;
            }

            window.registrarEvento('abriu_revista', { edicao: '01' });
        } catch(err) { console.warn("Firebase offline."); }
    </script>
</body>
