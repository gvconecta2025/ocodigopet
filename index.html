<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Código Pet - Revista Semanal</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-out; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }

<body class="bg-gray-100 text-gray-800 font-sans antialiased overflow-x-hidden">

    <div id="side-menu" class="fixed inset-0 bg-black/60 z-[60] hidden transition-opacity opacity-0" onclick="fecharMenuClickFora(event)">
        <div class="absolute right-0 top-0 bottom-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="side-menu-panel">
            <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="font-black text-gray-900 text-lg uppercase tracking-tighter">O Código Pet</h2>
                <button onclick="toggleMenu()" class="text-gray-500 hover:text-red-600 text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 flex-1 overflow-y-auto">
                <h3 class="font-bold text-gray-400 text-[10px] uppercase tracking-[0.2em] mb-4">Acervo de Edições</h3>
                <ul class="space-y-4">
                    <li>
                        <button onclick="toggleMenu(); renderView('home')" class="w-full flex items-center justify-between font-black text-blue-700 border border-blue-200 bg-blue-50 p-3 rounded-lg">
                            Edição 01 <span class="bg-blue-600 text-white text-[9px] px-2 py-1 rounded uppercase">Atual</span>
                        </button>
                    </li>
                    <li class="opacity-50">
                        <button class="w-full flex items-center justify-between font-bold text-gray-600 p-3 cursor-not-allowed">
                            Edição 02 <span class="text-gray-400 text-[9px] uppercase"><i class="fa-solid fa-lock"></i> Em breve</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div id="app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col">
        
        <header class="bg-white sticky top-0 z-40 shadow-md header-line w-full">
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex flex-col cursor-pointer group" onclick="renderView('home')">
                    <h1 class="text-2xl font-black tracking-tighter text-blue-700 uppercase leading-none">O CÓDIGO PET</h1>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">Revista do Profissional</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">Ed. 01</span>
                    <button onclick="toggleMenu()" class="text-gray-700 hover:text-blue-600 focus:outline-none p-1">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 overflow-x-auto whitespace-nowrap text-[11px] font-bold text-gray-500 uppercase tracking-wide flex gap-5 scrollbar-hide">
                <span onclick="goToCategory('varejo')" class="cursor-pointer hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600 transition">Pet Shop</span>
                <span onclick="goToCategory('clinica')" class="cursor-pointer hover:text-teal-600 border-b-2 border-transparent hover:border-teal-600 transition">Clínica</span>
                <span onclick="goToCategory('estetica')" class="cursor-pointer hover:text-pink-600 border-b-2 border-transparent hover:border-pink-600 transition">Estética</span>
                <span onclick="goToCategory('comportamento')" class="cursor-pointer hover:text-orange-600 border-b-2 border-transparent hover:border-orange-600 transition">Adestramento</span>
                <span onclick="goToCategory('hospedagem')" class="cursor-pointer hover:text-indigo-600 border-b-2 border-transparent hover:border-indigo-600 transition">Hotelzinho</span>
            </div>
        </header>

        <main id="main-content" class="flex-1 pb-16 bg-white"></main>

        <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto z-50 pointer-events-none h-12">
            <button id="btn-voltar" onclick="renderView('home')" class="hidden absolute left-5 pointer-events-auto w-12 h-12 bg-black/60 backdrop-blur-md border border-white/20 rounded-full text-white flex items-center justify-center shadow-2xl hover:bg-black/80 active:scale-90 transition-all duration-300">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <button id="btn-up" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="absolute right-5 pointer-events-auto w-12 h-12 bg-black/60 backdrop-blur-md border border-white/20 rounded-full text-white flex items-center justify-center shadow-2xl hover:bg-black/80 active:scale-90 transition-all duration-300 translate-y-10 opacity-0">
                <i class="fa-solid fa-arrow-up text-lg"></i>
            </button>
        </div>
    </div>

    <script>
        window.registrarEvento = function(tipo, detalhes) {};
        window.qualificarLead = async function(dados) {};

        // Banco de Dados Local com Regwall ativado (premium: true)
        const bancoDeArtigos = {
            varejo: { id: 'varejo', nome: 'Pet Shop', tagColor: 'text-blue-700', bgColor: 'bg-blue-50', artigos: [
                { id: 'v1', premium: true, titulo: 'Como aumentar a margem de lucro na venda de rações premium', img: 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=600&q=80', resumo: 'Descubra a matemática por trás da prateleira e como o estoque parado devora seu caixa.' },
                { id: 'v2', premium: false, titulo: 'Vitrine no WhatsApp: Venda sem o cliente pisar na loja', img: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=600&q=80', resumo: 'Estratégias de fotos e mensagens para conversão direta no chat.' },
                { id: 'v3', premium: false, titulo: 'A técnica do "Leva e Traz" inteligente', img: 'https://images.unsplash.com/photo-1553688738-a278b9f063e0?w=600&q=80', resumo: 'Logística barata que dobra a conversão no balcão físico.' }
            ]},
            clinica: { id: 'clinica', nome: 'Clínica Veterinária', tagColor: 'text-teal-700', bgColor: 'bg-teal-50', artigos: [
                { id: 'c1', premium: true, titulo: 'Reduzindo as faltas nas consultas agendadas via WhatsApp', img: 'https://images.unsplash.com/photo-1628009368231-7bb7cb192fb6?w=600&q=80', resumo: 'O script exato que derrubou o "No-Show" em 80% nas clínicas.' },
                { id: 'c2', premium: false, titulo: 'Prevenção Lucrativa: Calendário Automático', img: 'https://images.unsplash.com/photo-1576201836106-db1758fd1c97?w=600&q=80', resumo: 'Gerando receita previsível com vacinas e vermífugos.' },
                { id: 'c3', premium: false, titulo: 'Experiência Premium no Diagnóstico', img: 'https://images.unsplash.com/photo-1584820927498-cafe6c1c953a?w=600&q=80', resumo: 'Como humanizar laudos e aumentar o ticket médio.' }
            ]},
            estetica: { id: 'estetica', nome: 'Banho & Tosa', tagColor: 'text-pink-700', bgColor: 'bg-pink-50', artigos: [
                { id: 'e1', premium: true, titulo: 'O cálculo real de custos: Assinatura Mensal de Banho', img: 'https://images.unsplash.com/photo-1583337260546-28b6bf66d004?w=600&q=80', resumo: 'O passo a passo estratégico para pagar suas contas fixas no dia 1º.' },
                { id: 'e2', premium: false, titulo: '3 Estratégias para fidelizar clientes no Banho e Tosa', img: 'https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?w=600&q=80', resumo: 'Pare de depender de promoções e crie uma carteira de fiéis.' },
                { id: 'e3', premium: false, titulo: 'A Técnica do Upsell na Hidratação', img: 'https://images.unsplash.com/photo-1527526029430-319f10814151?w=600&q=80', resumo: 'Treine sua equipe para vender mais na entrega.' }
            ]},
            comportamento: { id: 'comportamento', nome: 'Adestramento', tagColor: 'text-orange-700', bgColor: 'bg-orange-50', artigos: [
                { id: 'a1', premium: true, titulo: 'Gestão de Contratos: Vendendo pacotes premium', img: 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600&q=80', resumo: 'Use consultorias estratégicas para elevar o seu ticket médio.' },
                { id: 'a2', premium: false, titulo: 'Parcerias com Pet Shops Locais', img: 'https://images.unsplash.com/photo-1537151608804-ea6f1103d82f?w=600&q=80', resumo: 'Transforme lojistas nos seus melhores vendedores.' },
                { id: 'a3', premium: false, titulo: 'Desafios Semanais por WhatsApp', img: 'https://images.unsplash.com/photo-1554692911-37d363b2f8a4?w=600&q=80', resumo: 'Escale seu tempo com aulas híbridas.' }
            ]},
            hospedagem: { id: 'hospedagem', nome: 'Hotelzinho Pet', tagColor: 'text-indigo-700', bgColor: 'bg-indigo-50', artigos: [
                { id: 'h1', premium: true, titulo: 'Planilhando a Recorrência: Alta Temporada vs Daycare', img: 'https://images.unsplash.com/photo-1601758174114-e711c0cbaa69?w=600&q=80', resumo: 'A engenharia financeira para manter os canis ocupados o ano todo.' },
                { id: 'h2', premium: false, titulo: 'Diário de Bordo Pet no Instagram', img: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=600&q=80', resumo: 'Use vídeos de 15s para fechar pacotes mensais.' },
                { id: 'h3', premium: false, titulo: 'Triagem Comportamental Digital', img: 'https://images.unsplash.com/photo-1541599540903-216a46ca1dc0?w=600&q=80', resumo: 'O formulário que blinda sua equipe de problemas.' }
            ]}
        };

        let currentView = 'home';

        window.toggleMenu = function() {
            const menu = document.getElementById('side-menu');
            const panel = document.getElementById('side-menu-panel');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => { menu.classList.remove('opacity-0'); panel.classList.remove('translate-x-full'); }, 10);
            } else {
                panel.classList.add('translate-x-full');
                menu.classList.add('opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }
        window.fecharMenuClickFora = function(event) { if(event.target.id === 'side-menu') toggleMenu(); }

        window.goToCategory = function(catId) {
            if (currentView !== 'home') renderView('home');
            setTimeout(() => {
                const section = document.getElementById('sec-' + catId);
                if(section) window.scrollTo({top: section.getBoundingClientRect().top + window.scrollY - 100, behavior: 'smooth'});
            }, 50);
        }

        window.renderView = function(view, param = null) {
            currentView = view;
            const mainContent = document.getElementById('main-content');
            const btnVoltar = document.getElementById('btn-voltar');
            
            mainContent.innerHTML = ''; 
            window.scrollTo(0, 0);
            
            if (view === 'home') {
                btnVoltar.classList.add('hidden');
                renderHomeFeed(mainContent);
            } else if (view === 'artigo') {
                btnVoltar.classList.remove('hidden');
                renderArtigo(mainContent, param);
            }
        };

        function renderHomeFeed(container) {
            let html = `<div class="fade-in">`;
            
            // Texto reposicionado
            html += `
                <div class="px-5 pt-6 pb-4 bg-white border-b border-gray-100">
                    <p class="text-sm text-gray-600 leading-relaxed">
                        Conteúdo tático para a linha de frente (<strong class="text-gray-900">funcionários e atendentes</strong>) e estratégias avançadas de gestão para <strong class="text-gray-900">donos de negócios Pet</strong>.
                    </p>
                </div>
            `;

            const destaque = bancoDeArtigos.varejo.artigos[0];
            html += `
                <div class="cursor-pointer bg-white mb-2 relative group" onclick="abrirArtigo('varejo', '${destaque.id}')">
                    <img src="${destaque.img}" class="w-full h-72 object-cover group-hover:brightness-90 transition">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 p-5 w-full">
                        <span class="bg-gray-800 text-yellow-400 font-bold text-[10px] px-2 py-1 rounded uppercase tracking-widest mb-2 inline-flex items-center gap-1 shadow-md"><i class="fa-solid fa-lock"></i> Especial Gestão</span>
                        <h2 class="text-3xl font-black leading-tight text-white drop-shadow-md">${destaque.titulo}</h2>
                    </div>
                </div>
            `;

            for (const key in bancoDeArtigos) {
                const cat = bancoDeArtigos[key];
                html += `
                    <section id="sec-${cat.id}" class="${cat.bgColor} py-8 px-4 border-t border-gray-200">
                        <h3 class="${cat.tagColor} text-sm font-black uppercase tracking-[0.2em] mb-5 border-l-4 border-current pl-3">${cat.nome}</h3>
                        <div class="flex flex-col gap-6">
                `;
                cat.artigos.forEach((artigo, idx) => {
                    if (key === 'varejo' && idx === 0) return;
                    
                    const badge = artigo.premium ? `<span class="text-xs text-yellow-600 font-bold bg-yellow-100 px-2 py-0.5 rounded ml-2 inline-flex items-center gap-1"><i class="fa-solid fa-lock text-[10px]"></i> Gestão</span>` : '';

                    if (idx === 0 || (key === 'varejo' && idx === 1)) {
                        html += `
                            <div class="cursor-pointer group" onclick="abrirArtigo('${key}', '${artigo.id}')">
                                <img src="${artigo.img}" class="w-full h-48 object-cover rounded shadow-sm mb-3 group-hover:opacity-90 transition">
                                <h4 class="font-bold text-xl text-gray-900 leading-tight group-hover:text-blue-700 transition">${artigo.titulo} ${badge}</h4>
                                <p class="text-gray-500 text-sm mt-1 line-clamp-2">${artigo.resumo}</p>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="flex items-center gap-4 cursor-pointer group border-t border-gray-200/50 pt-4" onclick="abrirArtigo('${key}', '${artigo.id}')">
                                <div class="flex-1">
                                    <h4 class="font-bold text-base text-gray-800 leading-tight group-hover:text-blue-700 transition">${artigo.titulo} ${badge}</h4>
                                </div>
                                <img src="${artigo.img}" class="w-24 h-16 object-cover rounded shadow-sm group-hover:opacity-90">
                            </div>
                        `;
                    }
                });
                html += `</div></section>`;
            }
            container.innerHTML = html + `</div>`;
        }

        window.abrirArtigo = function(catId, artigoId) {
            const artigo = bancoDeArtigos[catId].artigos.find(a => a.id === artigoId);
            window.registrarEvento('leu_artigo', { categoria: catId, artigo_id: artigoId });
            renderView('artigo', { catId, artigo });
        }

        // LÓGICA DO REGWALL
        function renderArtigo(container, dados) {
            const { artigo } = dados;
            const isQualificado = localStorage.getItem('petlojas_lead_qualificado') === 'true';

            // Base do artigo
            let html = `
                <div class="fade-in bg-white min-h-screen pb-10">
                    <div class="px-5 pt-8 pb-6">
                        <h1 class="text-3xl font-black text-gray-900 leading-tight tracking-tight">${artigo.titulo}</h1>
                    </div>
                    <img src="${artigo.img}" class="w-full h-64 object-cover shadow-inner">
            `;

            // Verifica bloqueio
            if (artigo.premium && !isQualificado) {
                html += `
                    <div class="px-6 py-6 text-gray-800 leading-relaxed text-lg font-serif relative">
                        <p><span class="float-left text-6xl font-black mr-3 mt-2 text-blue-600 font-sans leading-none">O</span> conteúdo estratégico deste artigo é focado na estruturação financeira e administrativa do seu negócio. As métricas operacionais ditam a saúde do fluxo de caixa.</p>
                        <p class="blur-content mt-4">Quando o gestor não tem visibilidade sobre a margem de lucro real dos serviços, a operação corre o risco de sangrar recursos diariamente sem que ninguém note na linha de frente do atendimento.</p>
                        <p class="blur-content mt-4">A solução começa pela auditoria de processos, garantindo que o custo fixo esteja diluído de forma eficiente...</p>
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-white via-white/95 to-transparent flex flex-col items-center justify-end pb-4 pt-10">
                            <div class="bg-white border border-gray-200 shadow-2xl rounded-xl p-6 w-[90%] text-center">
                                <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                                    <i class="fa-solid fa-lock"></i>
                                </div>
                                <h3 class="font-black text-gray-900 text-lg leading-tight mb-2">Conteúdo Exclusivo para Gestores</h3>
                                <p class="text-xs text-gray-500 mb-5">Informe o seu perfil para desbloquear artigos focados em gestão financeira e escala de negócios.</p>
                                
                                <select id="cargo-lead" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 mb-3">
                                    <option value="" disabled selected>Qual a sua função?</option>
                                    <option value="Dono / Sócio">Dono / Sócio</option>
                                    <option value="Gerente / Administrador">Gerente / Administrador</option>
                                    <option value="Veterinário Independente">Veterinário Autônomo</option>
                                    <option value="Atendente / Vendedor">Atendente / Vendedor</option>
                                    <option value="Banhista / Tosador">Banhista / Tosador</option>
                                    <option value="Outro">Outro</option>
                                </select>
                                
                                <input type="tel" id="whatsapp-lead" placeholder="Seu WhatsApp (com DDD)" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 mb-4">
                                
                                <button onclick="processarQualificacao()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition-transform">
                                    Desbloquear Artigo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            } else {
                // Renderização normal do artigo liberto
                html += `
                    <div class="px-6 py-8 text-gray-800 leading-relaxed text-lg font-serif">
                        <p><span class="float-left text-6xl font-black mr-3 mt-2 text-blue-600 font-sans leading-none">O</span> conteúdo estratégico deste artigo é focado em aumentar a eficiência do seu negócio pet. Aplique as dicas hoje mesmo para ver os resultados na próxima semana.</p>
                        <br><h3 class="font-bold text-xl text-gray-900 font-sans mt-4">Ponto de Atenção</h3>
                        <p>O mercado muda rapidamente, e os gestores que automatizam tarefas saem na frente da concorrência local.</p>
                    </div>
                    <div class="m-5 p-8 rounded-2xl bg-blue-600 text-white text-center shadow-xl shadow-blue-200">
                        <h4 class="font-black text-xl mb-2">Escale sua operação Pet!</h4>
                        <p class="text-sm text-blue-100 mb-6">Pare de apagar incêndios e comece a gerenciar seu fluxo com inteligência.</p>
                        <button onclick="clicouCTA('${artigo.id}')" class="w-full bg-white text-blue-700 font-black py-3 px-8 rounded-full shadow-lg">Falar com Consultor</button>
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        window.processarQualificacao = function() {
            const cargo = document.getElementById('cargo-lead').value;
            const zap = document.getElementById('whatsapp-lead').value;

            if (!cargo || !zap || zap.length < 10) {
                alert("Por favor, preencha o seu cargo e o seu WhatsApp corretamente.");
                return;
            }

            // Atualiza o telemóvel para não pedir novamente
            localStorage.setItem('petlojas_lead_qualificado', 'true');
            localStorage.setItem('petlojas_cargo_lead', cargo);
            localStorage.setItem('petlojas_whatsapp_lead', zap);

            // Envia para o motor 2 (Firebase)
            window.qualificarLead({ cargo: cargo, telefone: zap });

            // Recarrega o artigo atual com o texto liberto
            const btnVoltar = document.getElementById('btn-voltar');
            btnVoltar.click(); // Hack para forçar redraw via histórico, na V2 faríamos um re-render direto
            setTimeout(() => {
                const arrUrl = window.location.href.split('?');
                // Ocultar formulário forçando a re-renderização
                renderView(currentView, { artigo: bancoDeArtigos['varejo'].artigos[0] }); // Placeholder simplificado
                alert("Artigo Desbloqueado com sucesso!");
                window.scrollTo(0,0);
            }, 100);
        }

        window.clicouCTA = (o) => window.registrarEvento('clicou_cta', { de: o });

        window.addEventListener('scroll', () => {
            const btnUp = document.getElementById('btn-up');
            if(btnUp) {
                if (window.scrollY > 300) btnUp.classList.remove('translate-y-10', 'opacity-0');
                else btnUp.classList.add('translate-y-10', 'opacity-0');
            }
        });

        renderView('home');
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
                authDomain: "crmpetshop.firebaseapp.com",
                projectId: "crmpetshop",
                storageBucket: "crmpetshop.firebasestorage.app",
                messagingSenderId: "381013124221",
                appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
            };
            
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const urlParams = new URLSearchParams(window.location.search);
            const leadIdUrl = urlParams.get('lead_id') || 'anonimo';

            window.registrarEvento = async function(tipoEvento, detalhes = {}) {
                try {
                    await addDoc(collection(db, "eventos_tracking"), {
                        lead_id: localStorage.getItem('petlojas_whatsapp_lead') || leadIdUrl,
                        origem_aplicacao: "revista_semanal",
                        tipo_evento: tipoEvento,
                        detalhes: detalhes,
                        timestamp: Date.now()
                    });
                } catch (e) {}
            }

            window.qualificarLead = async function(dados) {
                try {
                    // Grava o lead capturado na coleção de leads (Injetando no CRM)
                    await addDoc(collection(db, "leads_qualificados_revista"), {
                        telefone: dados.telefone,
                        cargo: dados.cargo,
                        origem: "regwall_revista",
                        data_captura: serverTimestamp()
                    });
                    
                    // Dispara um evento de tracking para auditoria
                    window.registrarEvento('lead_qualificado_regwall', { cargo: dados.cargo });
                } catch (e) {
                    console.error("Erro ao gravar lead:", e);
                }
            }

            window.registrarEvento('abriu_revista', { edicao: '01' });

        } catch(err) {
            console.warn("Firebase offline.");
        }
    </script>
</body>
</html>
