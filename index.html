        window.registrarEvento = function() {};

        window.executarLoginEmail = function() { alert("Firebase offline."); };
        window.executarLoginGoogle = function() { alert("Firebase offline."); };

        // SISTEMA DE VISITANTE ÚNICO (Conforme pedido V2)
        let visitorId = localStorage.getItem('petlojas_visitor_id');
        if(!visitorId) {
            visitorId = 'vis_' + Date.now() + Math.random().toString(36).substr(2, 5);
            localStorage.setItem('petlojas_visitor_id', visitorId);
        }

        let routeEntryTime = Date.now();
        let maxScrollDepth = 0;
        let currentRouteName = 'home';

        window.addEventListener('scroll', () => {
            const h = document.documentElement;
            const scrollPercent = (h.scrollTop + h.clientHeight) / h.scrollHeight * 100;
            if(scrollPercent > maxScrollDepth) maxScrollDepth = Math.round(scrollPercent);
            
            const btnUp = document.getElementById('btn-up');
            if(btnUp) window.scrollY > 300 ? btnUp.classList.remove('translate-y-10', 'opacity-0') : btnUp.classList.add('translate-y-10', 'opacity-0');
        });

        function fecharCicloPagina() {
            const timeSpentSeconds = Math.round((Date.now() - routeEntryTime) / 1000);
            window.registrarEvento('leave_page', { 
                pagina: currentRouteName, 
                tempo_segundos: timeSpentSeconds,
                scroll_percentual: maxScrollDepth
            });
            // Reset timers
            routeEntryTime = Date.now();
            maxScrollDepth = 0;
        }

        let tfData = { cargo: '', desafio: '', interesses: [], nome: '', whatsapp: '', email: '', tipo: 'gestor' };
        let pendingArticle = null;
        let currentView = 'home';
        
        let logoClicks = 0;
        let logoTimer = null;
        window.handleLogoClick = function() {
            if (currentView !== 'home' && currentView !== 'admin') renderView('home');
            logoClicks++;
            if (logoClicks >= 5) { 
                logoClicks = 0; 
                abrirLogin();
            }
            clearTimeout(logoTimer);
            logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
        }

        function abrirLogin() {
            const modal = document.getElementById('login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
        function fecharLogin() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }
        window.togglePassword = function() {
            const input = document.getElementById('login-pass');
            const icon = document.getElementById('eye-icon');
            if(input.type === 'password') { input.type = 'text'; icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); } 
            else { input.type = 'password'; icon.classList.add('fa-eye'); icon.classList.remove('fa-eye-slash'); }
        }

        window.toggleMenu = function() {
            const menu = document.getElementById('side-menu');
            const panel = document.getElementById('side-menu-panel');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => { menu.classList.remove('opacity-0'); panel.classList.remove('translate-x-full'); }, 10);
            } else {
                panel.classList.add('translate-x-full'); menu.classList.add('opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }
        window.fecharMenuClickFora = function(event) { if(event.target.id === 'side-menu') toggleMenu(); }

        window.goToCategory = function(catId) {
            if (currentView !== 'home') renderView('home');
            setTimeout(() => {
                const section = document.getElementById('sec-' + catId);
                if(section) window.scrollTo({top: section.getBoundingClientRect().top + window.scrollY - 100, behavior: 'smooth'});
            }, 50);
        }

        window.renderView = function(view, param = null) {
            fecharCicloPagina();
            currentView = view;
            if(param && param.id) currentRouteName = param.id;
            else currentRouteName = view;

            const mainContent = document.getElementById('main-content');
            const btnVoltar = document.getElementById('btn-voltar');
            const navCategorias = document.getElementById('nav-categorias');
            const footer = document.getElementById('main-footer');
            mainContent.innerHTML = ''; window.scrollTo(0, 0);
            if (view === 'home') { btnVoltar.classList.add('hidden'); navCategorias.classList.remove('hidden'); footer.classList.remove('hidden'); renderHomeFeed(mainContent); }
            else if (view === 'artigo') { btnVoltar.classList.remove('hidden'); navCategorias.classList.remove('hidden'); footer.classList.remove('hidden'); renderArtigo(mainContent, param); }
            else if (view === 'admin') { btnVoltar.classList.remove('hidden'); navCategorias.classList.add('hidden'); footer.classList.add('hidden'); renderAdminPanel(mainContent); }
        };

                    </p>
                </div>
            `;

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
                authDomain: "crmpetshop.firebaseapp.com",
                projectId: "crmpetshop",
                storageBucket: "crmpetshop.firebasestorage.app",
                messagingSenderId: "381013124221",
                appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
            };
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            window.registrarEvento = async function(tipo, detalhes) {
                try { await addDoc(collection(db, "eventos_tracking"), { visitor_id: visitorId, origem: "revista", tipo_evento: tipo, detalhes, timestamp: Date.now() }); } catch (e) {}
            }

            window.qualificarLead = async function(dados) {
                try { await addDoc(collection(db, "leads_qualificados_revista"), { ...dados, origem: "revista", data_captura: serverTimestamp() }); } catch (e) {}
            }

            // LÓGICA DE AGREGAÇÃO PARA O PAINEL DE ADMINISTRAÇÃO (CAPRICHADO)
            window.fetchAdminData = async function() {
                let report = { totalEventos: 0, totalLeads: 0, visitantesUnicos: 0, leadsList: [], intMap: {}, pathMap: {}, maxTime: 0, avgTime: 0, ctaClicks: 0, formOpens: 0, formCompletes: 0 };
                try {
                    const snapLeads = await getDocs(query(collection(db, "leads_qualificados_revista"), limit(50)));
                    report.totalLeads = snapLeads.size;
                    snapLeads.forEach(doc => { 
                        const d = doc.data();
                        report.leadsList.push(d); 
                        if(d.interesses) d.interesses.forEach(i => { report.intMap[i] = (report.intMap[i] || 0) + 1; });
                    });

                    const snapEventos = await getDocs(query(collection(db, "eventos_tracking"), limit(500)));
                    report.totalEventos = snapEventos.size; 
                    let vIds = new Set();
                    let timeSum = 0;
                    let timeCount = 0;

                    snapEventos.forEach(doc => {
                        const d = doc.data();
                        if(d.visitor_id) vIds.add(d.visitor_id);
                        if(d.tipo_evento === 'clique_ad_petlojas') report.ctaClicks++;
                        if(d.tipo_evento === 'regwall_open') report.formOpens++;
                        if(d.tipo_evento === 'regwall_submit') report.formCompletes++;
                        
                        if(d.tipo_evento === 'leave_page' && d.detalhes) {
                            const p = d.detalhes.pagina;
                            const t = Number(d.detalhes.tempo_segundos) || 0;
                            const s = Number(d.detalhes.scroll_percentual) || 0;
                            
                            if(!report.pathMap[p]) report.pathMap[p] = { views: 0, scrollAcc: 0 };
                            report.pathMap[p].views++;
                            report.pathMap[p].scrollAcc += s;

                            if(t > 0 && t < 3600) { // Ignora sessões de mais de 1h (provável aba esquecida aberta)
                                timeSum += t;
                                timeCount++;
                            }
                        }
                    });
                    report.visitantesUnicos = vIds.size;
                    if(timeCount > 0) report.avgTime = Math.round(timeSum / timeCount);

                } catch(e) { console.error("Erro banco:", e); }
                return report;
            }

            // SISTEMA DE LOGIN
            window.executarLoginEmail = function() {
                const e = document.getElementById('login-email').value;
                const p = document.getElementById('login-pass').value;
                const btn = document.getElementById('btn-login-mail');
                if(!e || !p) return alert('Preencha os dados.');
                btn.innerText = "Autenticando...";
                signInWithEmailAndPassword(auth, e, p)
                    .then((cr) => { fecharLogin(); renderView('admin'); })
                    .catch((er) => { alert('Falha no login: ' + er.message); })
                    .finally(() => { btn.innerText = "Entrar no Painel"; });
            }

            window.executarLoginGoogle = function() {
                signInWithPopup(auth, provider).then((cr) => {
                    fecharLogin(); renderView('admin');
                }).catch((er) => { alert('Erro Google: ' + er.message); });
            }

            window.executarLogout = function() {
                signOut(auth).then(() => { renderView('home'); alert('Sessão encerrada.'); });
            }

            window.registrarEvento('abriu_revista', { edicao: '01' });
        } catch(err) { console.warn("Firebase offline."); }
    </script>
</body>
</html>
