<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista O Código Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .blur-text { filter: blur(6px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-gray-900 text-white text-center p-6 sticky top-0 z-40 shadow-md">
        <h1 class="text-3xl font-black cursor-pointer" onclick="carregarLista('tutores')">O CÓDIGO PET</h1>
        <div class="mt-4 flex justify-center space-x-4">
            <button onclick="carregarLista('tutores')" class="bg-green-600 px-4 py-2 rounded font-bold text-sm hover:bg-green-500 transition-colors">Para Tutores (Grátis)</button>
            <button onclick="carregarLista('gestores')" class="bg-yellow-600 px-4 py-2 rounded font-bold text-sm hover:bg-yellow-500 text-gray-900 transition-colors">Para Gestores (Premium)</button>
        </div>
    </header>

    <main id="app-container" class="max-w-4xl mx-auto p-4 mt-6 min-h-screen"></main>

    <div id="paywall-modal" class="hidden fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl max-w-md w-full text-center shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-yellow-500"></div>
            <h2 class="text-2xl font-black mb-2 text-gray-900">Conteúdo Premium 🔒</h2>
            <p class="text-gray-600 mb-6 text-sm">Este caderno é exclusivo para donos de Pet Shop e Clínicas. Insira os seus dados para destravar o acesso gratuitamente.</p>
            <form id="formLead" class="space-y-3 text-left">
                <input type="text" id="leadNome" placeholder="O seu Nome" class="w-full p-3 border rounded focus:ring-2 focus:ring-yellow-500 outline-none" required>
                <input type="text" id="leadLoja" placeholder="Nome do seu Pet Shop" class="w-full p-3 border rounded focus:ring-2 focus:ring-yellow-500 outline-none" required>
                <input type="tel" id="leadWhats" placeholder="WhatsApp (com DDD)" class="w-full p-3 border rounded focus:ring-2 focus:ring-yellow-500 outline-none" required>
                <button type="submit" id="btnDestravar" class="w-full bg-yellow-500 text-gray-900 font-black py-4 rounded hover:bg-yellow-400 mt-2 transition-transform transform hover:-translate-y-0.5">
                    Liberar Leitura Agora
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdbQabOOtQzgquLrDZ00GPFi0O9FIJaHc",
            authDomain: "ocodigopet.firebaseapp.com",
            projectId: "ocodigopet",
            storageBucket: "ocodigopet.firebasestorage.app",
            messagingSenderId: "631820637339",
            appId: "1:631820637339:web:25ea2942312d65ee09e23e",
            measurementId: "G-Q1HDW15MC9"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const appContainer = document.getElementById('app-container');
        
        const isGestorVIP = localStorage.getItem('codigo_pet_vip') === 'true';

        window.carregarLista = async function(publicoAlvo) {
            appContainer.innerHTML = '<p class="text-center text-gray-500 mt-10">A carregar artigos...</p>';
            
            try {
                // FILTRO DE PRODUÇÃO ATIVADO: Puxa apenas a aba clicada, ordenado do mais novo pro mais velho
                const q = query(collection(db, "artigos"), where("publico", "==", publicoAlvo), orderBy("data_publicacao", "desc"));
                const snapshot = await getDocs(q);
                
                let html = `<h2 class="text-2xl font-bold mb-6 border-b pb-2 uppercase text-gray-800">${publicoAlvo}</h2>`;
                html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="bg-white rounded shadow-sm hover:shadow-lg transition-shadow duration-300 cursor-pointer overflow-hidden group" onclick="abrirArtigo('${doc.id}')">
                            <div class="relative h-48 overflow-hidden">
                                ${data.publico === 'gestores' ? '<div class="absolute top-2 right-2 bg-yellow-500 text-gray-900 text-xs font-bold px-2 py-1 rounded z-10 shadow">PRO 🔒</div>' : ''}
                                <img src="${data.imagem}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-5">
                                <h3 class="text-xl font-bold mb-2 text-gray-900 group-hover:text-blue-600 transition-colors">${data.titulo}</h3>
                                <p class="text-gray-600 text-sm line-clamp-2">${data.resumo}</p>
                            </div>
                        </div>`;
                });
                html += '</div>';
                
                if(snapshot.empty) {
                    appContainer.innerHTML = `<p class="text-center text-gray-500 mt-10">Nenhum artigo publicado no caderno de ${publicoAlvo} ainda.</p>`;
                } else {
                    appContainer.innerHTML = html;
                }
            } catch (error) {
                console.error(error);
                appContainer.innerHTML = `<p class="text-center text-red-600 font-bold mt-10">Erro ao carregar matérias. Tente recarregar a página.</p>`;
            }
        }

        window.abrirArtigo = async function(id) {
            appContainer.innerHTML = '<p class="text-center mt-10 text-gray-500">A abrir matéria...</p>';
            try {
                const docSnap = await getDoc(doc(db, "artigos", id));

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let conteudoHTML = data.conteudo;
                    
                    if (data.publico === 'gestores' && !isGestorVIP) {
                        conteudoHTML = `<div class="blur-text">${data.conteudo}</div>`;
                        setTimeout(() => document.getElementById('paywall-modal').classList.remove('hidden'), 600);
                    }

                    appContainer.innerHTML = `
                        <button onclick="carregarLista('${data.publico}')" class="text-blue-600 font-bold mb-6 hover:text-blue-800 transition-colors flex items-center">
                            ← Voltar para a Capa
                        </button>
                        <article class="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-gray-100">
                            <span class="${data.publico === 'gestores' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'} font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">${data.publico}</span>
                            <h1 class="text-3xl md:text-5xl font-black mt-4 mb-6 leading-tight text-gray-900">${data.titulo}</h1>
                            <p class="text-xl text-gray-500 mb-8 font-medium leading-relaxed">${data.resumo}</p>
                            <img src="${data.imagem}" class="w-full h-[400px] object-cover rounded-xl mb-10 shadow-md">
                            <div class="prose max-w-none text-lg leading-relaxed text-gray-800 space-y-6">
                                ${conteudoHTML}
                            </div>
                        </article>
                    `;
                }
            } catch(error) {
                 console.error(error);
                 appContainer.innerHTML = '<p class="text-center text-red-500">Erro ao acessar arquivo.</p>';
            }
        }

        document.getElementById('formLead').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDestravar');
            btn.innerText = "A processar..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "leads_revista"), {
                    nome: document.getElementById('leadNome').value,
                    loja: document.getElementById('leadLoja').value,
                    whatsapp: document.getElementById('leadWhats').value,
                    data_captura: serverTimestamp()
                });
                
                localStorage.setItem('codigo_pet_vip', 'true');
                window.location.reload();
            } catch (error) {
                console.error(error);
                alert("Erro ao libertar o acesso. Verifique a conexão.");
                btn.innerText = "Liberar Leitura Agora"; btn.disabled = false;
            }
        });

        // Inicia na aba de Tutores por padrão
        carregarLista('tutores');
    </script>
</body>
</html>
