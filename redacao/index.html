<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redação | O Código Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-pen-nib text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-black tracking-tight">Sala de Redação</h1>
            </div>
            <a href="/" target="_blank" class="text-xs font-bold text-slate-300 hover:text-white transition">Ver Portal <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i></a>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto w-full p-4 md:p-8 fade-in">
        
        <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8">
                <h2 class="text-2xl font-black text-slate-900 mb-2">Nova Publicação</h2>
                <p class="text-sm text-slate-500 mb-8">Preencha os campos abaixo para injetar um novo artigo diretamente no Portal.</p>

                <form id="form-publicacao" onsubmit="publicarArtigo(event)" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">1. Direcionamento</label>
                            <select id="pub-alvo" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer">
                                <option value="tutores">🐕 Para Tutores (Aberto)</option>
                                <option value="gestor">💼 Para Gestores Pet (PRO / Requer Lead)</option>
                                <option value="funcionario">🩺 Para Funcionários / Operação (Aberto)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">2. Caderno / Editoria</label>
                            <input type="text" id="pub-caderno" required placeholder="Ex: Saúde, Vendas, Comportamento..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">3. Imagem de Capa (URL)</label>
                        <input type="url" id="pub-imagem" required placeholder="https://..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <p class="text-[10px] text-slate-400 mt-1">Dica: Cole o link de uma imagem do Unsplash ou do seu Google Drive.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">4. Título da Manchete</label>
                        <input type="text" id="pub-titulo" required placeholder="Escreva um título magnético..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-4 text-lg font-black text-slate-900 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">5. Linha Fina (Resumo Curto)</label>
                        <textarea id="pub-resumo" required placeholder="Um parágrafo curto para aparecer no card da notícia..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition h-20 resize-none"></textarea>
                    </div>

                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest">6. Corpo do Artigo</label>
                            <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-1 rounded font-mono">Aceita HTML (&lt;b&gt;, &lt;br&gt;, &lt;h3&gt;)</span>
                        </div>
                        <textarea id="pub-conteudo" required placeholder="Escreva a sua obra-prima aqui..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition h-80"></textarea>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <button type="submit" id="btn-enviar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> PUBLICAR NO PORTAL
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <footer class="text-center py-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        Sistema CMS • O Código Pet OS
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // IMPORTANTE: Insira aqui as mesmas chaves Firebase do seu portal ocodigopet
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "ocodigopet.firebaseapp.com",
            projectId: "ocodigopet",
            storageBucket: "ocodigopet.firebasestorage.app",
            messagingSenderId: "SEU_SENDER",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.publicarArtigo = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> TRANSMITINDO...';
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-slate-400');

            const artigo = {
                publico_alvo: document.getElementById('pub-alvo').value,
                caderno: document.getElementById('pub-caderno').value,
                imagem: document.getElementById('pub-imagem').value,
                titulo: document.getElementById('pub-titulo').value,
                resumo: document.getElementById('pub-resumo').value,
                conteudo: document.getElementById('pub-conteudo').value,
                data_publicacao: serverTimestamp(),
                autor: "Redação PetLojas",
                visualizacoes: 0
            };

            try {
                // Injeta na Coleção 'artigos' que o nosso Portal de Notícias está escutando
                await addDoc(collection(db, "artigos"), artigo);
                
                alert("SUCESSO! A matéria já está ao vivo no Portal.");
                document.getElementById('form-publicacao').reset();
                window.scrollTo(0, 0);

            } catch(erro) {
                console.error("Erro Crítico:", erro);
                alert("Falha de conexão com a base de dados. Verifique suas chaves Firebase.");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> PUBLICAR NO PORTAL';
                btn.disabled = false;
                btn.classList.replace('bg-slate-400', 'bg-blue-600');
            }
        };
    </script>
</body>
</html>
